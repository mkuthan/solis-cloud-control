[env]
_.file = ".env"

[tools]
python = "3.13"

[tasks.check]
description = "Run all checks (lint, lint-format, typecheck, test)"
run = ["uv run ruff format", "uv run ruff check --fix", "uv run ty check", "uv run pytest"]

[tasks.pre-commit]
description = "Git pre-commit hook"
run = ["mise run check"]
